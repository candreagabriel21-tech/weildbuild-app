name: Build Launcher Binaries

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --manifest-path rust/Cargo.toml

      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p dist
          cp rust/target/release/weildbuild-installer${{ matrix.ext }} dist/weildbuild_installer${{ matrix.ext }}
          cp rust/target/release/weildbuild-launcher${{ matrix.ext }} dist/weildbuild_launcher${{ matrix.ext }}
          cp rust/target/release/weildbuild-updater${{ matrix.ext }} dist/weildbuild_updater${{ matrix.ext }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weildbuild-launcher-${{ matrix.target }}
          path: dist/

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
